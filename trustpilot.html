<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --indigo: #2C415A; --jicama: #FBF8F2; --agave: #6FA0AF; --turmeric: #FFBC69; --text-dark: #1A1A1A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--indigo);
    font-family: 'Greycliff CF', 'Proxima Nova', 'Poppins', Arial, sans-serif; overflow: hidden; }
  .wrap { display: flex; flex-direction: column; width: 100vw; height: 100vh; padding: 4vh 6vw; }
  .header { display: flex; justify-content: space-between; align-items: baseline; color: var(--jicama); margin-bottom: 3vh; }
  .header h1 { font-family: 'Masqualero', 'Proxima Nova', Arial, sans-serif; font-weight: 700; font-size: 2.6vw; letter-spacing: 0.02em; }
  .header .meta { font-size: 1.1vw; opacity: 0.75; }
  .stage { flex: 1; position: relative; }
  .card { position: absolute; inset: 0; background: var(--jicama); border-radius: 24px;
    border-left: 12px solid var(--agave); padding: 5vh 5vw; display: flex; flex-direction: column;
    justify-content: center; opacity: 0; transform: translateY(16px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .card.active { opacity: 1; transform: translateY(0); }
  .stars { color: var(--turmeric); font-size: 2.6vw; letter-spacing: 0.05em; line-height: 1; }
  .quote-text { font-size: 3.1vw; line-height: 1.35; color: var(--text-dark); font-weight: 500; margin: 1vh 0 4vh 0; }
  .attribution { display: flex; align-items: center; gap: 1.2vw; }
  .badge { background: var(--indigo); color: var(--jicama); font-size: 1.15vw; font-weight: 700; padding: 0.6vh 1.4vw; border-radius: 999px; letter-spacing: 0.03em; }
  .who { font-size: 1.4vw; color: var(--text-dark); opacity: 0.75; }
  .footer { display: flex; justify-content: space-between; align-items: center; color: var(--jicama); opacity: 0.6; margin-top: 3vh; font-size: 1vw; }
  .dots { display: flex; gap: 0.5vw; flex-wrap: wrap; }
  .dot { width: 0.6vw; height: 0.6vw; border-radius: 50%; background: rgba(251,248,242,0.3); transition: background 0.3s ease; }
  .dot.active { background: var(--agave); }
  .live-dot { display: inline-block; width: 0.7vw; height: 0.7vw; border-radius: 50%; background: #6FCF97; margin-right: 0.6vw; animation: pulse 2s infinite ease-in-out; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>

": "customer Yolanda Hughes", "text": "Money was transferred straight away , all informations were simple , very easy to understand, straight forward. Great job.", "date": "2026-07-25", "rating": 5}, {"source": "Trustpilot", "id": "6a6437fa2a02ce1ab10c45f6", "name": "Willard Boyd McDougal", "text": "They always take 4 to 7 days to make the money available. I've sent MANY transfers and always to the same 2 people. Western Union frequently gets smaller value transactions in a single day, but Remitly NEVER does.", "date": "2026-07-25", "rating": 3}, {"source": "Trustpilot", "id": "6a643214826ba442e9978e25", "name": "Henry", "text": "It's fast sending money reliable and trustworthy", "date": "2026-07-25", "rating": 5}, {"source": "Trustpilot", "id": "6a64292828d694e9b01a6767", "name": "customer", "text": "Seamless, quick transaction each time I have used the service. Hard to beat that. I would recommend Remitley.", "date": "2026-07-25", "rating": 5}, {"source": "Trustpilot", "id": "6a6422cf7ef3f5014b10872a", "name": "Issa S.", "text": "Hasta ahora ha funcionado bien el servicio. El dinero que he enviado ha llegado justo cuando se necesita y sin demoras. Excelente servicio.", "date": "2026-07-25", "rating": 5}, {"source": "Trustpilot", "id": "6a640bee15f6a652ec6d4789", "name": "cliente", "text": "Muy bueno no me quejo Pero si me gustar\u00eda que ampl\u00eden el rango de env\u00edo", "date": "2026-07-25", "rating": 3}, {"source": "Trustpilot", "id": "6a640b47bdb47fbc65992361", "name": "customer", "text": "At first it was difficult because I was sending a large amount so your representative asked me a lot of personal questions but the smaller transfers on money was seamless.", "date": "2026-07-25", "rating": 5}, {"source": "Trustpilot", "id": "6a6404c24610237534bb4beb", "name": "jonathan", "text": "It\u2019s the worst company to sent money . They suspended my account even without hearing what I was saying .", "date": "2026-07-25", "rating": 1}, {"source": "Trustpilot", "id": "6a64000657c025e8aaaf13e3", "name": "Nedal Mokdad", "text": "Tack f\u00f6r snabb service", "date": "2026-07-25", "rating": 5}, {"source": "Trustpilot", "id": "6a63fe76f7179f2d69f896c2", "name": "Kay", "text": "Very simple and easy", "date": "2026-07-25", "rating": 5}, {"source": "Trustpilot", "id": "6a63fbc7c3cca28b34fa4117", "name": "Roberto Ayala", "text": "very safe and fast to send money to my family. Thank you to Remitly.\ud83d\ude4f", "date": "2026-07-25", "rating": 5}, {"source": "Trustpilot", "id": "6a63e92411fd446cf25f61bd", "name": "cliente", "text": "Muy bien el dinero llega enseguida", "date": "2026-07-25", "rating": 5}, {"source": "Trustpilot", "id": "6a63e154f1ae3d13ebd5cc05", "name": "Jose carlos pardini", "text": "Envios r\u00e1pidos y seguros", "date": "2026-07-25", "rating": 5}, {"source": "Trustpilot", "id": "6a63d905f3c47011cc6bbe25", "name": "Laura", "text": "Trustworthy, fast, reliable and easy!", "date": "2026-07-24", "rating": 5}, {"source": "Trustpilot", "id": "6a63ca713053fd97d1149577", "name": "customer", "text": "Very fast and no fee", "date": "2026-07-24", "rating": 5}, {"source": "Trustpilot", "id": "6a63bacc1c3c89e3fcb31bcd", "name": "Muhammad Nasir", "text": "I am a driver worker", "date": "2026-07-24", "rating": 5}, {"source": "Trustpilot", "id": "6a63b80e45b8a1a83ec7c96e", "name": "cliente", "text": "Remitly la mejor opci\u00f3n de env\u00edos a tu pais.", "date": "2026-07-24", "rating": 5}, {"source": "Trustpilot", "id": "6a63b5f111891fbe4e5bd954", "name": "cliente", "text": "me ha funcionado muy bien es muy r\u00e1pido y confiable", "date": "2026-07-24", "rating": 5}, {"source": "Trustpilot", "id": "6a63b56c43ff2f77515f1c90", "name": "Nar Bahadur Gurung", "text": "Very fast and reliable service.", "date": "2026-07-24", "rating": 5}, {"source": "Trustpilot", "id": "6a63b1997b102bbff2a76869", "name": "\u00c1lvaro Zabaleta", "text": "Son r\u00e1pidos puntuales y responsables", "date": "2026-07-24", "rating": 5}];
  const stage = document.getElementById('stage');
  const dotsWrap = document.getElementById('dots');

  REVIEWS.forEach((r, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (i === 0 ? ' active' : '');
    const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
    card.innerHTML = `
      <div class="stars">${stars}</div>
      <div class="quote-text">${r.text.replace(/</g,'&lt;')}</div>
      <div class="attribution">
        <span class="badge">${r.source}</span>
        <span class="who">${r.name} &middot; ${r.date}</span>
      </div>`;
    stage.appendChild(card);
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dotsWrap.appendChild(dot);
  });

  let idx = 0;
  const cards = stage.querySelectorAll('.card');
  const dots = dotsWrap.querySelectorAll('.dot');
  function next() {
    cards[idx].classList.remove('active');
    dots[idx].classList.remove('active');
    idx = (idx + 1) % cards.length;
    cards[idx].classList.add('active');
    dots[idx].classList.add('active');
  }
  if (cards.length > 1) setInterval(next, 7000);
  setTimeout(() => location.reload(), 30 * 60 * 1000);
</script>
</body>
</html>
